<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Velora Admin</title><style>
body{font-family:Arial,sans-serif;background:#fff8fb;margin:0;color:#211b1f}.wrap{max-width:1200px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #eadbe1;border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 8px 30px #5b32410d}h1{font-size:30px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat b{font-size:28px;display:block;color:#b05270}.stat span{color:#75666d}.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center}.btn{border:0;background:#b95a77;color:white;border-radius:20px;padding:10px 15px;cursor:pointer}.btn.dark{background:#211b1f}.login{max-width:400px;margin:80px auto}.login input,.product-form input,.product-form select{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #e2d4da;border-radius:10px;box-sizing:border-box}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #eee;text-align:left;font-size:13px}select{padding:7px;border-radius:8px;border:1px solid #ddd}.muted{color:#87757c;font-size:12px}@media(max-width:800px){.grid{grid-template-columns:1fr}.card{overflow:auto}}
</style></head><body><div id="app"></div><script src="/admin/admin.js"></script></body></html>
